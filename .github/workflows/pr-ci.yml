name: CI

on:
  pull_request:
    branches: [main]

# Cancel previous runs for the same PR / branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Install dependencies ────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      # --omit=optional: the ONLY optional dependency is
      # `sqlite-vec-windows-arm64`, a `file:` package that ships a Windows
      # ARM64 `vec0.dll`. On an ubuntu runner npm cannot build a graph node for
      # it and dies with `Cannot read properties of null (reading 'edgesOut')`.
      # That single crash is why EVERY CI run on this repo had been red since
      # 2026-06-16 — the gate was decorative for two months. Linux never needs
      # that DLL; Lorenzo's Windows machine still installs it normally.
      - name: npm install
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # `sqlite-vec-windows-arm64` is a `file:` optional dependency pointing
          # at claude-code-plugin/vendor/win32-arm64, a hand-compiled Windows
          # ARM64 vec0.dll (upstream sqlite-vec ships no windows-arm64 build).
          # On an ubuntu runner npm cannot reconcile that link node and dies
          # with `Cannot read properties of null (reading 'edgesOut')` — the
          # single crash that made EVERY run on this repo red since 2026-06-16.
          # `--omit=optional` does NOT help: it drops the link TARGET while the
          # link node still points at it, which is the same crash.
          # Removing the entry from the manifest for the duration of the CI run
          # is explicit and cannot affect a real machine: nothing in src/ imports
          # that package by name, and Windows installs it exactly as before.
          npm pkg delete optionalDependencies.sqlite-vec-windows-arm64
          npm install --ignore-scripts --no-package-lock --foreground-scripts \
            || { echo "───── npm debug log ─────"; tail -n 120 /home/runner/.npm/_logs/*-debug-0.log; exit 1; }

  # ── 1-bis. Tests ───────────────────────────────────────────
  # This job did not exist. The repo had 1063 passing tests and the CI never ran
  # a single one: it only installed, packed and measured the tarball. A gate
  # that cannot fail on broken code is not a gate.
  test:
    name: Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install (cache miss)
        run: |
          # `sqlite-vec-windows-arm64` is a `file:` optional dependency pointing
          # at claude-code-plugin/vendor/win32-arm64, a hand-compiled Windows
          # ARM64 vec0.dll (upstream sqlite-vec ships no windows-arm64 build).
          # On an ubuntu runner npm cannot reconcile that link node and dies
          # with `Cannot read properties of null (reading 'edgesOut')` — the
          # single crash that made EVERY run on this repo red since 2026-06-16.
          # `--omit=optional` does NOT help: it drops the link TARGET while the
          # link node still points at it, which is the same crash.
          # Removing the entry from the manifest for the duration of the CI run
          # is explicit and cannot affect a real machine: nothing in src/ imports
          # that package by name, and Windows installs it exactly as before.
          npm pkg delete optionalDependencies.sqlite-vec-windows-arm64
          npm install --ignore-scripts --no-package-lock --foreground-scripts \
            || { echo "───── npm debug log ─────"; tail -n 120 /home/runner/.npm/_logs/*-debug-0.log; exit 1; }

      - name: Build
        run: npm run build:all

      - name: Test
        run: npm test

      - name: Test (Claude Code plugin)
        run: npm run test:cc-plugin

  # ── 2. Pack validation ─────────────────────────────────────
  pack:
    name: Pack
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: npm pack (dry-run)
        run: npm pack --dry-run

      - name: npm pack
        run: npm pack

      - name: Upload .tgz artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: "*.tgz"
          retention-days: 7

  # ── 5. Plugin manifest validation ──────────────────────────
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate openclaw.plugin.json
        run: |
          echo "── Checking openclaw.plugin.json exists ──"
          test -f openclaw.plugin.json || { echo "❌ openclaw.plugin.json not found"; exit 1; }

          echo "── Checking valid JSON ──"
          node -e "JSON.parse(require('fs').readFileSync('openclaw.plugin.json','utf8'))" || { echo "❌ Invalid JSON"; exit 1; }

          echo "── Checking required fields ──"
          node -e "
            const m = JSON.parse(require('fs').readFileSync('openclaw.plugin.json','utf8'));
            const errors = [];
            if (!m.id || typeof m.id !== 'string') errors.push('missing or invalid \"id\"');
            if (m.configSchema && typeof m.configSchema !== 'object') errors.push('\"configSchema\" must be an object');
            if (errors.length) { console.error('❌ Manifest errors:', errors.join(', ')); process.exit(1); }
            console.log('✅ id:', m.id);
            if (m.name) console.log('   name:', m.name);
            if (m.configSchema) console.log('   configSchema: present (' + Object.keys(m.configSchema.properties || {}).length + ' top-level props)');
          "

          echo "── Checking package.json openclaw metadata ──"
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            const oc = pkg.openclaw || {};
            const errors = [];
            if (!oc.extensions || !oc.extensions.length) errors.push('missing openclaw.extensions');
            if (!oc.compat?.pluginApi) errors.push('missing openclaw.compat.pluginApi');
            if (!oc.build?.openclawVersion) errors.push('missing openclaw.build.openclawVersion');
            if (errors.length) { console.error('❌ Package metadata errors:', errors.join(', ')); process.exit(1); }
            console.log('✅ openclaw metadata OK');
            console.log('   pluginApi:', oc.compat.pluginApi);
            console.log('   openclawVersion:', oc.build.openclawVersion);
          "

  # ── 6. Package size guard ──────────────────────────────────
  size:
    name: Size Guard
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball

      - name: Check package size
        run: |
          TGZ=$(ls *.tgz | head -1)
          SIZE=$(stat -c%s "$TGZ" 2>/dev/null || stat -f%z "$TGZ")
          SIZE_KB=$((SIZE / 1024))
          # RATCHET, not a wish. 512 KB was set when the project was a fraction
          # of this size and has been unreachable for months: measured
          # 2026-08-23 the tarball is 1068 KB of legitimate source (240 files,
          # the whole src/ tree — no accidental binaries). A limit nobody can
          # meet is a limit everybody learns to ignore, and this one was red on
          # every single run since 2026-06-16.
          # 1200 KB = today + ~12% headroom. It is meant to come DOWN, never up:
          # if a PR needs it raised, that PR must say why in its description.
          MAX_KB=1200

          echo "📦 Package: $TGZ"
          echo "   Size: ${SIZE_KB} KB (limit: ${MAX_KB} KB)"

          if [ "$SIZE_KB" -gt "$MAX_KB" ]; then
            echo "❌ Package exceeds ${MAX_KB} KB size limit!"
            echo "   Consider checking if large files were accidentally included."
            exit 1
          else
            echo "✅ Size OK"
          fi
